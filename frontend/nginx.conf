proxy_cache_path /var/cache/proxy
    levels=1:2
    keys_zone=frontend_cache:10m
    max_size=100m
    inactive=1h
    use_temp_path=off;

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;

    server_tokens off;

    absolute_redirect off;

    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    location = / {
        return 302 /momo-store/;
    }

    location /momo-store/ {
        try_files $uri $uri/ /momo-store/index.html;
    }

    location ~* ^/momo-store/(js|css|img)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/auth/whoami {
        set $backend http://backend:8081;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

    }

    location /api/ {
        proxy_cache frontend_cache;
        proxy_cache_valid 200 10m;
        add_header X-Cache-Status $upstream_cache_status;
        set $backend http://backend:8081;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
